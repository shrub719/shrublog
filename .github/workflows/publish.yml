name: Publish

on:
  push:
    branches:
      - main
    paths:
      - 'build/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone posts
        uses: actions/checkout@v4
        with:
          repository: shrub719/sb-src
          token: ${{ secrets.SRC_TOKEN }}
          path: src

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Setup Python
        run: pip3 install markdown

      - name: Build
        run: just build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./shrublog

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

